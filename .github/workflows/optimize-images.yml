name: Optimize images

# Shrinks and strips metadata from pictures pushed to assets/img/,
# including files uploaded through the GitHub website ("Add file → Upload files").
on:
  push:
    branches: [main]
    paths:
      - "assets/img/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Optimize
        run: python scripts/optimize_images.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/img; then
            echo "Nothing to optimise."
            exit 0
          fi
          git config user.name  "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add assets/img
          git commit -m "chore(img): optimise images"
          git pull --rebase origin main
          git push
