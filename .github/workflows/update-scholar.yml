name: Update Scholar stats

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet scholarly

      - name: Fetch citation metrics
        env:
          # Optional repository secrets (Settings → Secrets and variables → Actions):
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}         # most reliable
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}   # proxy for scholarly
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }} # polite-pool e-mail
        run: python scripts/fetch_scholar.py --out data/scholar.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "scholar-bot"
          git config user.email "scholar-bot@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "chore(data): update Scholar stats $(date -u +%F)"
          git push
